name: D1 Migrations

# Applies pending D1 migrations to the remote database whenever migration
# files land on main. Idempotent: D1 tracks applied migrations in a
# d1_migrations table, so running this on every migration change is safe.
# Must run before the Worker deploy serves new code; the runtime schema
# bootstrap (ensureSchema) remains the additive-column safety net.

on:
  push:
    branches: [main]
    paths:
      - 'server/migrations/*.sql'
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply sift-sync --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
