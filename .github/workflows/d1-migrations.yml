name: D1 Migrations

# Applies pending D1 migrations to the remote database whenever migration
# files land on main (and via manual dispatch).
#
# Self-healing by design: the Worker's runtime schema bootstrap
# (ensureSchema in server/sync/schema.ts) creates additive columns on first
# request, which can race ahead of this job and make a migration's ALTER
# fail with "duplicate column name". That failure is expected, not an error:
# the column already exists, so the migration is recorded as applied and
# the job continues. Any other failure fails the job loudly.

on:
  push:
    branches: [main]
    paths:
      - 'server/migrations/*.sql'
  workflow_dispatch:

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply D1 migrations (duplicate-column tolerant)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for f in server/migrations/*.sql; do
            name=$(basename "$f")
            out=$(npx wrangler d1 execute sift-sync --remote --file "$f" 2>&1) && rc=0 || rc=$?
            if [ $rc -eq 0 ]; then
              npx wrangler d1 execute sift-sync --remote --command \
                "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$name')" >/dev/null
              echo "applied: $name"
              continue
            fi
            if echo "$out" | grep -q 'duplicate column name'; then
              # Runtime schema bootstrap already created the column — the
              # schema change is live; record it as applied.
              echo "warning: $name already applied by runtime schema bootstrap — recording"
              npx wrangler d1 execute sift-sync --remote --command \
                "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$name')" >/dev/null
            else
              echo "$out"
              exit 1
            fi
          done
          echo "All migrations applied."
