name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Install grubble
        run: |
          curl -sSL -o grubble.tar.gz \
            "https://github.com/davegarvey/grubble/releases/download/v5.6.2/grubble-linux-x86_64.tar.gz"
          tar xzf grubble.tar.gz
          chmod +x grubble
          rm grubble.tar.gz

      - name: Bump version
        id: bump
        run: |
          git fetch origin main
          git checkout --detach origin/main
          BUMP_TYPE=$(./grubble --bump-type)
          echo "BUMP_TYPE=$BUMP_TYPE"
          ./grubble --tag --preset node --package-files "package.json,packages/siftctl/package.json"
          NEW=$(./grubble --raw --preset node)
          echo "NEW=$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          git restore --worktree --staged package.json packages/siftctl/package.json

      - name: Push release branch and create PR
        if: steps.bump.outputs.bump_type != 'none'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/v${VERSION}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            git merge --strategy-option=ours --no-edit origin/main
          else
            git checkout -b "${BRANCH}" origin/main
          fi
          VERSION="${VERSION}" node --input-type=module -e '
            import fs from "node:fs";
            for (const file of ["package.json", "packages/siftctl/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = process.env.VERSION;
              fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            }
          '
          git add package.json packages/siftctl/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${VERSION}"
          fi
          git push --set-upstream origin "${BRANCH}"
          PR_URL=$(gh pr list --base main --head "${BRANCH}" --json url --jq '.[0].url')
          if [ -z "${PR_URL}" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "Release v${VERSION}" \
              --body "Automated release PR created by grubble.")
          fi
          gh pr merge "$PR_URL" --auto --squash

  push-tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Push version tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

  publish-siftctl:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm i -g npm@latest

      - run: npm ci

      - run: npm run build --workspace siftctl

      - run: npm publish --workspace siftctl
