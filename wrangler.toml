name = "sift"
main = "server/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "sift-sync"
database_id = "00d4053d-2d65-4f56-991b-e0804046bb13"
migrations_dir = "server/migrations"

[[d1_databases]]
binding = "POLL_DB"
database_name = "sift-poll"
database_id = "52c8076e-5053-4425-aadf-0526a8482f54"
migrations_dir = "server/migrations-poll"

[[ratelimits]]
name = "PROXY_FETCH_LIMITER"
namespace_id = "7301"
simple = { limit = 2000, period = 60 }

[[ratelimits]]
name = "PROXY_IMAGE_LIMITER"
namespace_id = "7302"
simple = { limit = 600, period = 60 }

[vars]
FEED_POLLING = "true"

[triggers]
crons = ["0 3 * * *", "*/10 * * * *"]
